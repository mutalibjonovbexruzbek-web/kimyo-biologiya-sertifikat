document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*16}deg) rotateX(${-y*16}deg) translateZ(10px)`});

draw("Yangi savollar tayyorlanmoqda…");fill(k).then(r=>{if(ct==k&&a.querySelector("[data-t]"))draw(r?"Savollar har 90 daqiqada yangilanadi.":"Yangi savollar hozir mavjud emas, asosiy bazadan foydalaniladi.")})}
function tq(k){st={qs:sh(B.map((q,i)=>i).filter(i=>B[i].t==k)).map(mk),n:0,a:[],mock:0,k:k};show()}
function start(c){if(c){st=ld("ms",null)}else{const seen=ld("seen",[]),all=B.map((q,i)=>i),un=sh(all.filter(i=>!seen.includes(B[i].q))),rs=sh(all.filter(i=>seen.includes(B[i].q))),pk=un.concat(rs).slice(0,45);sv("seen",(un.length>=45?seen:[]).concat(pk.map(i=>B[i].q)));st={qs:pk.map(mk),n:0,a:[],mock:1,end:Date.now()+36e5};sv("ms",st)}show()}
function tick(){const r=Math.max(0,st.end-Date.now()),e=document.getElementById("tm");if(e)e.textContent=String(Math.floor(r/6e4)).padStart(2,"0")+":"+String(Math.floor(r/1e3)%60).padStart(2,"0");if(!r)fin()}
function show(){clearInterval(tm);const q=st.qs[st.n],d=st.a[st.n],ans=d!=null;
a.innerHTML=`<div class="prog"><i style="width:${(st.n+1)/st.qs.length*100}%"></i></div><div class="bar"><span>Savol ${st.n+1}/${st.qs.length}</span>${st.mock?'<b id="tm"></b>':''}</div><h3>${q.q}</h3>`+q.o.map((x,j)=>`<button class="o ${ans?(j==q.c?"ok":j==d?"no":""):""}" ${ans?"disabled":""} onclick="pick(${j})"><em>${"ABCD"[j]}</em>${x}</button>`).join("")+(ans?`<div class="ex"><b>${d==q.c?"To'g'ri!":"Noto'g'ri."}</b> To'g'ri javob: ${"ABCD"[q.c]}. ${q.e}</div>`:"")+`<div>${bk}<button onclick="fin()">Yakunlash</button>${ans&&st.n<st.qs.length-1?'<button onclick="nx()">Keyingisi</button>':''}</div>`;
if(st.mock){tick();tm=setInterval(tick,1e3)}}
function pick(j){st.a[st.n]=j;if(st.mock)sv("ms",st);show()}
function nx(){st.n++;if(st.mock)sv("ms",st);show()}
function fin(){clearInterval(tm);let c=0,s={};st.qs.forEach((q,i)=>{const ok=st.a[i]==q.c;c+=ok;const x=s[q.t]=s[q.t]||[0,0];x[0]+=ok;x[1]++});
const p=Math.round(c/st.qs.length*100),L=[[86,"A+"],[76,"A"],[66,"B+"],[56,"B"],[46,"C+"],[36,"C"]].find(x=>p>=x[0]),
f=g=>Object.keys(s).filter(k=>g(s[k][0]/s[k][1])).map(k=>`${T[k][0]} (${s[k][0]}/${s[k][1]})`).join(", ")||"–";
st.done=1;if(!st.mock&&st.k){const bb=ld("best",{});bb[st.k]=Math.max(bb[st.k]||0,p);sv("best",bb)}if(st.mock)sv("ms",st);
a.innerHTML=`<div class="res"><div class="ring" style="--p:${p}"><span>${p}%</span></div><h2>Natija: ${c}/${st.qs.length}</h2></div>${st.mock?`<p class="lv">Ehtimoliy sertifikat darajasi: <b>${L?L[1]:"sertifikat darajasiga yetmadi"}</b></p><p><small>Bu taxminiy baho: rasmiy ball hisoblashidan farq qilishi mumkin.</small></p>`:""}<p><b>Afzalliklaringiz:</b> ${f(r=>r>=.7)}</p><p><b>Kamchiliklaringiz:</b> ${f(r=>r<.5)}</p>`+bk}
